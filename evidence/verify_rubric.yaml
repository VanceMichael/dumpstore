rubrics:
  - id: 1
    type: f2p
    text: 每个被接纳的变更在第一条任务进度产生前拥有稳定操作标识；并发请求标识不同，API、执行步骤、最终响应、日志和审计可用该标识对应到同一操作。
  - id: 2
    type: f2p
    text: runOp 的 Ansible TaskStep 与 runLocal 的本地 ops step 使用同一带操作标识和单调序号的进度协议，并分别产生恰好一个成功、失败或超时终态。
  - id: 3
    type: f2p
    text: 两个标签页或两个同时运行的变更只显示各自操作的步骤和终态；任意交错顺序都不会串日志、提前关闭对话框或让一个操作覆盖另一个操作的结果。
  - id: 4
    type: f2p
    text: SSE 断线重连能从客户端最后确认的序号按序补回有界历史，已见步骤不重复；慢订阅者被 broker 关闭后使用相同恢复语义，而不是等待下一条瞬时事件。
  - id: 5
    type: f2p
    text: 客户端在 mutation 执行中断开时后台操作继续完成，重连或显式查询可取得唯一最终结果；历史已过期时返回稳定的不可恢复或已过期响应，不伪造进行中状态。
  - id: 6
    type: f2p
    text: 操作状态和步骤的保存有明确上限与清理生命周期；清理中的订阅、终态写入和新查询并发时不会泄漏 goroutine、关闭错误 channel 或返回半个终态。
  - id: 7
    type: p2p
    text: 单窗口操作的现有表现、mutation 最终 HTTP payload、普通 broker 缓存主题、jobs.update、EventSource 自动重连以及原有 playbook 和本地命令结果保持兼容，相关回归测试通过。
